<svg viewBox="0 0 900 480" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" style="background-color: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; font-family: 'PT Sans', -apple-system, sans-serif;">
    <defs>
        <!-- Drop Shadow Filter -->
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.1" flood-color="#1e293b" />
        </filter>
        <!-- Gradients -->
        <linearGradient id="grad-hw" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f59e0b" />
            <stop offset="100%" stop-color="#d97706" />
        </linearGradient>
        <linearGradient id="grad-parser" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#06b6d4" />
            <stop offset="100%" stop-color="#0891b2" />
        </linearGradient>
        <linearGradient id="grad-decoder" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#3b82f6" />
            <stop offset="100%" stop-color="#1d4ed8" />
        </linearGradient>
        <linearGradient id="grad-gui" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#10b981" />
            <stop offset="100%" stop-color="#047857" />
        </linearGradient>
        <linearGradient id="grad-log" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#6366f1" />
            <stop offset="100%" stop-color="#4338ca" />
        </linearGradient>
        <linearGradient id="grad-tx" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ec4899" />
            <stop offset="100%" stop-color="#be185d" />
        </linearGradient>
        
        <!-- Marker for arrowheads -->
        <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b" />
        </marker>
        <marker id="arrow-pink" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#be185d" />
        </marker>
    </defs>

    <!-- Background grid/pattern -->
    <rect width="900" height="480" fill="#f8fafc" rx="12" />
    
    <!-- Hardware vs Software boundaries -->
    <rect x="15" y="15" width="180" height="450" rx="8" fill="rgba(245, 158, 11, 0.04)" stroke="rgba(245, 158, 11, 0.15)" stroke-dasharray="4" />
    <text x="105" y="445" font-size="12" font-weight="bold" fill="#b45309" text-anchor="middle">PHYSICAL LAYER</text>
    
    <rect x="210" y="15" width="675" height="450" rx="8" fill="rgba(59, 130, 246, 0.02)" stroke="rgba(59, 130, 246, 0.1)" stroke-dasharray="4" />
    <text x="547" y="445" font-size="12" font-weight="bold" fill="#1d4ed8" text-anchor="middle">BYTEHOUND SOFTWARE LAYER</text>

    <!-- Nodes -->
    
    <!-- 1. Serial Port Hardware -->
    <g filter="url(#shadow)">
        <rect x="30" y="70" width="150" height="70" rx="8" fill="url(#grad-hw)" />
        <text x="105" y="100" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Serial Port I/O</text>
        <text x="105" y="118" fill="#fef3c7" font-size="11" text-anchor="middle">COM Port / USB-CDC</text>
    </g>

    <!-- 2. Packet Parser -->
    <g filter="url(#shadow)">
        <rect x="240" y="70" width="150" height="70" rx="8" fill="url(#grad-parser)" />
        <text x="315" y="100" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Packet Parser</text>
        <text x="315" y="118" fill="#ecfeff" font-size="11" text-anchor="middle">Framed or Modbus RTU</text>
    </g>

    <!-- 3. Frame Decoder -->
    <g filter="url(#shadow)">
        <rect x="450" y="70" width="150" height="70" rx="8" fill="url(#grad-decoder)" />
        <text x="525" y="100" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Frame Decoder</text>
        <text x="525" y="118" fill="#eff6ff" font-size="11" text-anchor="middle">Scale/Offset, Enums</text>
    </g>

    <!-- 4. GUI Dashboard -->
    <g filter="url(#shadow)">
        <rect x="670" y="30" width="190" height="75" rx="8" fill="url(#grad-gui)" />
        <text x="765" y="60" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">GUI Panels &amp; Plots</text>
        <text x="765" y="78" fill="#ecfdf5" font-size="11" text-anchor="middle">Data Table, Plots, Console</text>
        <text x="765" y="93" fill="#ecfdf5" font-size="10" font-style="italic" text-anchor="middle">(PySide6 Threaded @ 60Hz)</text>
    </g>

    <!-- 5. Logging Session -->
    <g filter="url(#shadow)">
        <rect x="670" y="145" width="190" height="75" rx="8" fill="url(#grad-log)" />
        <text x="765" y="175" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Logging Engine</text>
        <text x="765" y="193" fill="#e0e7ff" font-size="11" text-anchor="middle">*_raw.csv + *_decoded.xlsx</text>
        <text x="765" y="208" fill="#e0e7ff" font-size="10" font-style="italic" text-anchor="middle">(Continuous disk write)</text>
    </g>

    <!-- TX path -->

    <!-- 6. Control Panel / User Writes -->
    <g filter="url(#shadow)">
        <rect x="670" y="270" width="190" height="75" rx="8" fill="url(#grad-tx)" />
        <text x="765" y="300" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Control Inputs</text>
        <text x="765" y="318" fill="#fce7f3" font-size="11" text-anchor="middle">TX Commands &amp; Param Edits</text>
        <text x="765" y="333" fill="#fce7f3" font-size="10" font-style="italic" text-anchor="middle">(Interactive UI triggers)</text>
    </g>

    <!-- 7. Packet Builder -->
    <g filter="url(#shadow)">
        <rect x="450" y="272" width="150" height="70" rx="8" fill="url(#grad-decoder)" />
        <text x="525" y="302" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Packet Builder</text>
        <text x="525" y="320" fill="#eff6ff" font-size="11" text-anchor="middle">Reverses Scale &amp; CRC</text>
    </g>

    <!-- 8. Priority TX Queue -->
    <g filter="url(#shadow)">
        <rect x="240" y="272" width="150" height="70" rx="8" fill="url(#grad-parser)" />
        <text x="315" y="302" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Priority TX Queue</text>
        <text x="315" y="320" fill="#ecfeff" font-size="11" text-anchor="middle">Preempts Polling Schedule</text>
    </g>

    <!-- Connective Arrows -->
    
    <!-- RX: Serial -> Parser -->
    <line x1="180" y1="105" x2="234" y2="105" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
    <text x="207" y="98" font-size="9" font-weight="bold" fill="#64748b" text-anchor="middle">RAW BYTES</text>

    <!-- RX: Parser -> Decoder -->
    <line x1="390" y1="105" x2="444" y2="105" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
    <text x="417" y="98" font-size="9" font-weight="bold" fill="#64748b" text-anchor="middle">FRAMES</text>

    <!-- RX: Decoder -> GUI & Logs (splitting) -->
    <!-- Path to GUI -->
    <path d="M 600 105 L 635 105 L 635 68 L 664 68" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
    <!-- Path to Log -->
    <path d="M 600 105 L 635 105 L 635 182 L 664 182" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
    <text x="630" y="98" font-size="9" font-weight="bold" fill="#64748b" text-anchor="middle">DECODED</text>

    <!-- TX: Control -> Builder -->
    <line x1="670" y1="307" x2="606" y2="307" stroke="#be185d" stroke-width="2" marker-end="url(#arrow-pink)" />
    <text x="638" y="300" font-size="9" font-weight="bold" fill="#be185d" text-anchor="middle">VALUES</text>

    <!-- TX: Builder -> Queue -->
    <line x1="450" y1="307" x2="396" y2="307" stroke="#be185d" stroke-width="2" marker-end="url(#arrow-pink)" />
    <text x="423" y="300" font-size="9" font-weight="bold" fill="#be185d" text-anchor="middle">PACKETS</text>

    <!-- TX: Queue -> Serial Port -->
    <path d="M 240 307 L 105 307 L 105 146" fill="none" stroke="#be185d" stroke-width="2" marker-end="url(#arrow-pink)" />
    <text x="135" y="220" font-size="9" font-weight="bold" fill="#be185d" text-anchor="middle" transform="rotate(-90 135 220)">TX BYTES (PRIORITY)</text>

    <!-- Auto-fetch Polling Loopback -->
    <path d="M 315 272 L 315 146" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow)" />
    <text x="322" y="210" font-size="9" fill="#0284c7">Auto-Fetch Polls</text>

</svg>
