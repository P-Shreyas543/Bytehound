[pytest]
# Manual smoke scripts at the repo root (smoke_*.py) open real serial ports
# at import time and need a connected device. They are not unit tests and
# must not be auto-collected — restrict collection to the dedicated test
# directories.
testpaths = tests single_cell_cycler/tests

# Test levels. Every collected test gets exactly one of these, assigned in
# the root conftest.py, so a single level runs with e.g. `pytest -m unit`.
markers =
    unit: a single function/class in isolation (no MainWindow, no worker threads)
    integration: several modules together (MainWindow, worker threads, loggers on disk, sockets)
    system: the complete app end-to-end against a simulated device
    acceptance: a requirement from ProjectRequirement.md checked from the user's point of view
